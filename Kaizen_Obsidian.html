<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#0a0e1a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Kaizen_Obsidian"/>

<title>Kaizen_Obsidian</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg-dark: #0a0e1a;
  --bg-darker: #060a15;
  --glass-1: rgba(255,255,255,0.08);
  --glass-2: rgba(255,255,255,0.12);
  --glass-border: rgba(255,255,255,0.15);
  --accent: #3b6cf8;
  --accent-2: #7c5cfc;
  --accent-glow: rgba(59,108,248,0.3);
  --text-1: #ffffff;
  --text-2: #b0b5c1;
  --text-3: #7a7f8d;
  --green: #10b981;
  --amber: #f59e0b;
  --red: #ef4444;
}

* {margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body {height:100%;font-family:'DM Sans',sans-serif;background:var(--bg-dark);color:var(--text-1);overflow:hidden}

#app {
  position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg-dark);
}

#mesh {
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 10% 20%, rgba(59,108,248,0.15) 0%, transparent 50%),
    radial-gradient(ellipse 70% 50% at 90% 80%, rgba(124,92,252,0.12) 0%, transparent 50%),
    radial-gradient(ellipse 60% 70% at 50% 50%, rgba(6,182,212,0.08) 0%, transparent 60%);
}

#header {
  position:relative;z-index:10;height:72px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
  background:rgba(10,14,26,0.7);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--glass-border);
}

.h-sub {font-size:10px;color:var(--text-3);letter-spacing:3px;text-transform:uppercase;margin-bottom:2px;font-weight:600;}
.h-name {font-family:'Sora',sans-serif;font-size:22px;font-weight:700;color:var(--text-1);letter-spacing:-0.5px;}
.h-name em {font-style:normal;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

#main {
  position:relative;z-index:5;flex:1;
  overflow-y:auto;overflow-x:hidden;
  padding:16px 16px calc(80px + 16px);
  scroll-behavior:smooth;
}

#main::-webkit-scrollbar {width:3px;}
#main::-webkit-scrollbar-thumb {background:var(--accent);border-radius:3px;opacity:0.4;}

.screen {display:none;}
.screen.active {display:block;animation:fade-in 0.3s ease-out;}

@keyframes fade-in {from {opacity:0;transform:translateY(8px)} to {opacity:1;transform:translateY(0)}}

.card {
  background:var(--glass-1);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border:1px solid var(--glass-border);
  border-radius:24px;
  padding:20px;
  position:relative;
  overflow:hidden;
  margin-bottom:16px;
  box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

.card::before {
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.08),rgba(255,255,255,0));
  pointer-events:none;border-radius:24px;
}

.card > * {position:relative;z-index:1;}

textarea, input[type="text"], input[type="range"], select {
  background:linear-gradient(135deg,rgba(59,108,248,0.08),rgba(124,92,252,0.08));
  border:1.5px solid rgba(59,108,248,0.25);
  border-radius:14px;
  padding:12px 16px;
  color:var(--text-1);
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:all 0.2s;
  box-shadow:inset 0 2px 8px rgba(0,0,0,0.2);
}

textarea::placeholder, input[type="text"]::placeholder, select::placeholder {
  color:var(--text-3);
}

textarea:focus, input[type="text"]:focus, select:focus {
  outline:none;
  border-color:var(--accent);
  background:linear-gradient(135deg,rgba(59,108,248,0.15),rgba(124,92,252,0.12));
  box-shadow:inset 0 2px 8px rgba(0,0,0,0.2),0 0 20px var(--accent-glow);
}

textarea {resize:vertical;min-height:100px;line-height:1.6;}

.btn {
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border:none;border-radius:14px;
  background:var(--glass-1);border:1px solid var(--glass-border);
  color:var(--text-1);font-size:13px;font-weight:500;
  cursor:pointer;transition:all 0.2s;
  font-family:'DM Sans',sans-serif;
}

.btn:hover {
  background:var(--glass-2);
  border-color:var(--accent);
  box-shadow:0 0 15px var(--accent-glow);
}

.btn.primary {
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border:none;color:#fff;
  box-shadow:0 8px 24px rgba(59,108,248,0.3);
}

.btn.primary:hover {
  box-shadow:0 12px 32px rgba(59,108,248,0.4);
}

.mood-btn {
  flex:1;padding:14px;border:2px solid var(--glass-border);
  border-radius:14px;background:var(--glass-1);
  cursor:pointer;font-size:28px;transition:all 0.2s;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}

.mood-btn:hover {
  border-color:var(--accent);
  background:rgba(59,108,248,0.1);
}

.nav {
  position:fixed;bottom:0;left:0;right:0;z-index:15;
  height:80px;
  background:rgba(10,14,26,0.8);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--glass-border);
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 0;
}

.nav-item {
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:8px;cursor:pointer;color:var(--text-3);font-size:11px;
  transition:all 0.2s;flex:1;
}

.nav-item.active {color:var(--accent);font-weight:600;}

.nav-item-icon {font-size:22px;}

.label {
  display:block;font-size:12px;color:var(--text-2);
  margin-bottom:8px;font-weight:500;text-transform:uppercase;
  letter-spacing:1px;
}

.divider {height:1px;background:var(--glass-border);margin:16px 0;}

.toast {
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.8);color:#fff;
  padding:12px 20px;border-radius:20px;
  font-size:12px;z-index:100;opacity:0;transition:opacity 0.3s;
  backdrop-filter:blur(10px);border:1px solid var(--glass-border);
}

.toast.show {opacity:1;}

.stat-box {
  background:var(--glass-1);border:1px solid var(--glass-border);
  border-radius:16px;padding:12px;text-align:center;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}

.stat-val {font-size:20px;font-weight:700;color:var(--accent);font-family:'Sora',sans-serif;margin-bottom:4px;}
.stat-label {font-size:11px;color:var(--text-3);}

.grid-2 {display:grid;grid-template-columns:1fr 1fr;gap:12px;}

@media(max-width:640px) {.grid-2 {grid-template-columns:1fr;}}

label {display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);cursor:pointer;}

input[type="radio"], input[type="checkbox"] {cursor:pointer;accent-color:var(--accent);}
</style>
</head>
<body>
<div id="app">
  <div id="mesh"></div>
  
  <header id="header">
    <div class="h-left">
      <div class="h-sub">Obsidian</div>
      <div class="h-name">Kaizen <em>Sync</em></div>
    </div>
  </header>

  <main id="main">
    <!-- JOURNAL SCREEN -->
    <div id="screen-journal" class="screen active">
      <div class="card">
        <div style="font-size:15px;font-weight:700;margin-bottom:16px;color:var(--text-1);">◈ Estado de Ánimo</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
          <button class="mood-btn" data-mood="😞" onclick="selectMood('😞')">😞</button>
          <button class="mood-btn" data-mood="😕" onclick="selectMood('😕')">😕</button>
          <button class="mood-btn" data-mood="😐" onclick="selectMood('😐')" style="border-color:var(--accent);background:rgba(59,108,248,0.1);">😐</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;">
          <button class="mood-btn" data-mood="😊" onclick="selectMood('😊')">😊</button>
          <button class="mood-btn" data-mood="🤩" onclick="selectMood('🤩')">🤩</button>
        </div>
      </div>

      <div class="card">
        <div style="font-size:15px;font-weight:700;margin-bottom:12px;color:var(--text-1);">◉ Sueño</div>
        <label style="margin-bottom:8px;">Horas anoche:</label>
        <input type="range" id="journal-sleep" min="0" max="12" step="0.5" value="7.5" style="width:100%;" onchange="updateSleepDisplay()"/>
        <div style="text-align:center;font-size:20px;color:var(--accent);font-weight:600;margin-top:8px;"><span id="sleep-display">7.5h</span></div>
      </div>

      <div class="card">
        <div style="font-size:15px;font-weight:700;margin-bottom:12px;color:var(--text-1);">◆ Reflexión</div>
        
        <label class="label">◈ Intención Principal</label>
        <textarea id="journal-intention" placeholder="¿Qué haría este día valioso?"></textarea>

        <label class="label" style="margin-top:12px;">◆ 3 Victorias de Ayer</label>
        <textarea id="journal-victories" placeholder="1.&#10;2.&#10;3."></textarea>

        <label class="label" style="margin-top:12px;">🚀 Próximo Paso NSR</label>
        <textarea id="journal-next-nsr" placeholder="Una acción concreta esta semana..."></textarea>
      </div>

      <div class="card">
        <div style="font-size:15px;font-weight:700;margin-bottom:12px;color:var(--text-1);">◉ Entrada Libre</div>
        <textarea id="journal-free" placeholder="Solo tú. Sin filtros. Escribe lo que sea — ideas, frustración, claridad, caos. Todo vale aquí 👁️"></textarea>
      </div>

      <div class="card">
        <div style="display:flex;gap:8px;">
          <button class="btn primary" onclick="downloadNote('journal')" style="flex:1;">📥 Descargar .md</button>
          <button class="btn" onclick="clearNoteContent('journal')" style="flex:1;">🗑️ Limpiar</button>
        </div>
      </div>
    </div>

    <!-- TDAH SCREEN -->
    <div id="screen-tdah" class="screen">
      <div class="card">
        <div style="font-size:15px;font-weight:700;margin-bottom:12px;color:var(--text-1);">⚡ TDAH / Síntomas</div>
        
        <label class="label">Contenido:</label>
        <textarea id="tdah-content" placeholder="Síntoma observado, medicamento tomado, link útil..."></textarea>

        <label class="label" style="margin-top:12px;">Etiquetas (opcional):</label>
        <input type="text" id="tdah-tags" placeholder="#síntoma #medicamento #artículo #seguimiento"/>

        <div style="display:flex;gap:8px;margin-top:12px;">
          <button class="btn primary" onclick="downloadNote('tdah')" style="flex:1;">📥 Descargar .md</button>
          <button class="btn" onclick="clearNoteContent('tdah')" style="flex:1;">🗑️ Limpiar</button>
        </div>
      </div>
    </div>

    <!-- IDEAS SCREEN -->
    <div id="screen-ideas" class="screen">
      <div class="card">
        <div style="font-size:15px;font-weight:700;margin-bottom:12px;color:var(--text-1);">💡 Ideas</div>
        
        <label class="label">Tipo:</label>
        <select id="idea-type" style="width:100%;">
          <option value="producto">Producto</option>
          <option value="servicio">Servicio</option>
          <option value="pwa">PWA</option>
          <option value="contenido">Contenido</option>
          <option value="otro">Otro</option>
        </select>

        <label class="label" style="margin-top:12px;">Título:</label>
        <input type="text" id="idea-title" placeholder="Título de la idea"/>

        <label class="label" style="margin-top:12px;">Descripción:</label>
        <textarea id="idea-content" placeholder="Describe tu idea..."></textarea>

        <label class="label" style="margin-top:12px;">Potencial:</label>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;">
          <label><input type="radio" name="idea-potential" value="bajo"/> Bajo</label>
          <label><input type="radio" name="idea-potential" value="medio"/> Medio</label>
          <label><input type="radio" name="idea-potential" value="alto" checked/> Alto</label>
          <label><input type="radio" name="idea-potential" value="patente"/> Patente</label>
        </div>

        <div style="display:flex;gap:8px;">
          <button class="btn primary" onclick="downloadNote('ideas')" style="flex:1;">📥 Descargar .md</button>
          <button class="btn" onclick="clearNoteContent('ideas')" style="flex:1;">🗑️ Limpiar</button>
        </div>
      </div>
    </div>

    <!-- GEN1 SCREEN -->
    <div id="screen-gen1" class="screen">
      <div class="card">
        <div style="font-size:15px;font-weight:700;margin-bottom:12px;color:var(--text-1);">📝 Genérica 1</div>
        
        <label class="label">Contenido:</label>
        <textarea id="gen1-content" placeholder="Escribe aquí..."></textarea>

        <label class="label" style="margin-top:12px;">Etiquetas (opcional):</label>
        <input type="text" id="gen1-tags" placeholder="#tag1 #tag2"/>

        <div style="display:flex;gap:8px;margin-top:12px;">
          <button class="btn primary" onclick="downloadNote('gen1')" style="flex:1;">📥 Descargar .md</button>
          <button class="btn" onclick="clearNoteContent('gen1')" style="flex:1;">🗑️ Limpiar</button>
        </div>
      </div>
    </div>

    <!-- GEN2 SCREEN -->
    <div id="screen-gen2" class="screen">
      <div class="card">
        <div style="font-size:15px;font-weight:700;margin-bottom:12px;color:var(--text-1);">📝 Genérica 2</div>
        
        <label class="label">Contenido:</label>
        <textarea id="gen2-content" placeholder="Escribe aquí..."></textarea>

        <label class="label" style="margin-top:12px;">Etiquetas (opcional):</label>
        <input type="text" id="gen2-tags" placeholder="#tag1 #tag2"/>

        <div style="display:flex;gap:8px;margin-top:12px;">
          <button class="btn primary" onclick="downloadNote('gen2')" style="flex:1;">📥 Descargar .md</button>
          <button class="btn" onclick="clearNoteContent('gen2')" style="flex:1;">🗑️ Limpiar</button>
        </div>
      </div>
    </div>
  </main>

  <!-- NAV -->
  <nav class="nav">
    <div class="nav-item active" onclick="switchScreen('journal')"><div class="nav-item-icon">📅</div><div>Journal</div></div>
    <div class="nav-item" onclick="switchScreen('tdah')"><div class="nav-item-icon">⚡</div><div>TDAH</div></div>
    <div class="nav-item" onclick="switchScreen('ideas')"><div class="nav-item-icon">💡</div><div>Ideas</div></div>
    <div class="nav-item" onclick="switchScreen('gen1')"><div class="nav-item-icon">📝</div><div>Gen1</div></div>
    <div class="nav-item" onclick="switchScreen('gen2')"><div class="nav-item-icon">📝</div><div>Gen2</div></div>
  </nav>
</div>

<div id="toast" class="toast"></div>

<script>
function switchScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(`screen-${name}`).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  event.target.closest('.nav-item').classList.add('active');
}

function selectMood(mood){
  document.querySelectorAll('.mood-btn').forEach(b=>{
    b.style.borderColor='var(--glass-border)';
    b.style.background='var(--glass-1)';
  });
  const btn=document.querySelector(`[data-mood="${mood}"]`);
  btn.style.borderColor='var(--accent)';
  btn.style.background='rgba(59,108,248,0.1)';
}

function updateSleepDisplay(){
  const val=document.getElementById('journal-sleep').value;
  document.getElementById('sleep-display').textContent=val+'h';
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2600);
}

function getNowFormatted(){
  const now=new Date();
  return now.toISOString().split('T')[0];
}

function getNowWithTime(){
  const now=new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`;
}

async function downloadNote(type){
  let filename,content;
  
  if(type==='journal'){
    filename=`${getNowFormatted()}-journal.md`;
    const mood=document.querySelector('.mood-btn[style*="accent"]')?.getAttribute('data-mood')||'😐';
    const sleep=document.getElementById('journal-sleep').value||'0';
    const intention=document.getElementById('journal-intention').value.trim()||'';
    const victories=document.getElementById('journal-victories').value.trim()||'';
    const nextNsr=document.getElementById('journal-next-nsr').value.trim()||'';
    const freeEntry=document.getElementById('journal-free').value.trim()||'';
    
    content=`# ◈ ${filename.split('-')[0]}\n\n**BUENOS DÍAS**\n\n## ◈ ESTADO DE ÁNIMO\n${mood}\n\n## ◉ SUEÑO\nHoras anoche: **${sleep}h**\n\n## ◆ REFLEXIÓN\n### ◈ INTENCIÓN PRINCIPAL\n${intention}\n\n### ◆ 3 VICTORIAS DE AYER\n${victories}\n\n### 🚀 PRÓXIMO PASO NSR\n${nextNsr}\n\n## ◉ ENTRADA LIBRE\n${freeEntry}\n\n---\n*Entrada creada en Kaizen_Obsidian*`;
  }else if(type==='tdah'){
    filename=`TDAH_${getNowWithTime()}.md`;
    const text=document.getElementById('tdah-content').value.trim();
    const tags=document.getElementById('tdah-tags').value.trim();
    content=`# ⚡ TDAH — Seguimiento\n**Timestamp:** ${new Date().toLocaleString()}\n\n${text}\n\n${tags?`Tags: ${tags}\n`:''}\n---\n*Creado en Kaizen_Obsidian*`;
  }else if(type==='ideas'){
    const title=document.getElementById('idea-title').value.trim();
    if(!title){showToast('⚠️ Ingresa un título');return;}
    filename=`IDEA_${title.replace(/\s+/g,'_')}.md`;
    const typeVal=document.getElementById('idea-type').value;
    const desc=document.getElementById('idea-content').value.trim();
    const potential=document.querySelector('input[name="idea-potential"]:checked').value;
    content=`# 💡 ${typeVal.toUpperCase()} — ${title}\n\n**Creado:** ${new Date().toLocaleString()}\n**Potencial:** ${potential}\n**Tipo:** ${typeVal}\n\n## Descripción\n${desc}\n\n## Próximos pasos\n- [ ] Investigar\n- [ ] Validar\n\n---\n*Idea creada en Kaizen_Obsidian*`;
  }else if(type==='gen1'){
    filename=`GEN1_${getNowWithTime()}.md`;
    const text=document.getElementById('gen1-content').value.trim();
    const tags=document.getElementById('gen1-tags').value.trim();
    content=`# Gen1\n**Timestamp:** ${new Date().toLocaleString()}\n\n${text}\n\n${tags?`Tags: ${tags}\n`:''}\n---\n*Creado en Kaizen_Obsidian*`;
  }else if(type==='gen2'){
    filename=`GEN2_${getNowWithTime()}.md`;
    const text=document.getElementById('gen2-content').value.trim();
    const tags=document.getElementById('gen2-tags').value.trim();
    content=`# Gen2\n**Timestamp:** ${new Date().toLocaleString()}\n\n${text}\n\n${tags?`Tags: ${tags}\n`:''}\n---\n*Creado en Kaizen_Obsidian*`;
  }
  
  try{
    if(window.showSaveFilePicker){
      const handle=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'Markdown',accept:{'text/markdown':['.md']}}]});
      const writable=await handle.createWritable();
      await writable.write(content);
      await writable.close();
      showToast(`✓ Guardado: ${filename}`);
    }else{
      throw new Error('showSaveFilePicker no disponible');
    }
  }catch(e){
    const blob=new Blob([content],{type:'text/markdown'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`✓ Descargado: ${filename}`);
  }
  clearNoteContent(type);
}

function clearNoteContent(type){
  if(type==='journal'){
    document.getElementById('journal-intention').value='';
    document.getElementById('journal-victories').value='';
    document.getElementById('journal-next-nsr').value='';
    document.getElementById('journal-free').value='';
    document.getElementById('journal-sleep').value='7.5';
    updateSleepDisplay();
    selectMood('😐');
  }else if(type==='tdah'){document.getElementById('tdah-content').value='';document.getElementById('tdah-tags').value='';}
  else if(type==='ideas'){document.getElementById('idea-title').value='';document.getElementById('idea-content').value='';}
  else if(type==='gen1'){document.getElementById('gen1-content').value='';document.getElementById('gen1-tags').value='';}
  else if(type==='gen2'){document.getElementById('gen2-content').value='';document.getElementById('gen2-tags').value='';}
}

// ══════════════════════════════════════════
//  PWA — Service Worker mejorado
// ══════════════════════════════════════════
if('serviceWorker'in navigator){
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([`
    const CACHE_NAME='kz-obsidian-v2.2';
    const ASSETS_TO_CACHE=['./', './index.html'];
    
    self.addEventListener('install',event=>{
      event.waitUntil(
        caches.open(CACHE_NAME).then(cache=>{
          return cache.addAll(ASSETS_TO_CACHE).catch(()=>{});
        }).catch(()=>{})
      );
      self.skipWaiting();
    });
    
    self.addEventListener('activate',event=>{
      event.waitUntil(
        caches.keys().then(cacheNames=>{
          return Promise.all(
            cacheNames.map(cacheName=>{
              if(cacheName!==CACHE_NAME){
                return caches.delete(cacheName);
              }
            })
          );
        })
      );
      self.clients.claim();
    });
    
    self.addEventListener('fetch',event=>{
      if(event.request.method!=='GET'){return;}
      event.respondWith(
        caches.match(event.request).then(response=>{
          return response||fetch(event.request).then(fetchResponse=>{
            if(!fetchResponse||fetchResponse.status!==200){
              return fetchResponse;
            }
            const responseToCache=fetchResponse.clone();
            caches.open(CACHE_NAME).then(cache=>{
              cache.put(event.request,responseToCache);
            });
            return fetchResponse;
          }).catch(()=>{
            return caches.match('./');
          });
        })
      );
    });
  `],{type:'application/javascript'}))).catch(()=>{});
}
